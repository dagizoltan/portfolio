  <text x="80" y="408" font-family="Helvetica, Arial, sans-serif" font-size="27"
        fill="#CCD3D8">Frontend engineering, Node.js and Deno services,</text>
  <text x="80" y="448" font-family="Helvetica, Arial, sans-serif" font-size="27"
        fill="#CCD3D8">and embedded systems. Budapest, Hungary.</text>

  <text x="80" y="540" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="21"
