<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Zoltán Dági — Software Developer, Budapest">
  <rect width="1200" height="630" fill="#01243F"/>

  <!-- Faint green grid, the same motif as the hero overlay -->
  <defs>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#3EB823" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <rect x="80" y="150" width="64" height="4" fill="#3EB823"/>

  <text x="80" y="250" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="92"
