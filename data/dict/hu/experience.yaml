head:
  title: "Tapasztalat | Dági Zoltán — szoftverfejlesztő"
  description: "Nyolc év szoftveres munka: frontend fejlesztés az Align Technology termékein, incidenskezelő eszköz az EPAM-nél, orvostechnikai IoT-eszköz és PCB-tervezés, valamint B2B piactér platformok."
  keywords: "szoftverfejlesztő tapasztalat, frontend fejlesztő Budapest, Next.js fejlesztő, Node.js fejlesztő, AWS CloudFormation, IoT fejlesztő, beágyazott rendszerek Magyarország"

hero:
  eyebrow: "MUNKAHELYEK — 2015-TŐL 2024-IG"
  title: "Nyolc pozíció, egy irány."
  short_description: "Minden pozíció az önéletrajzomból származik; az időtartamokat az oldal a dátumokból számolja."
  description: "Az út a Samsung és a Vodafone szervizeinek javításkövető szoftverétől egy kockázati tőkéből épült orvostechnikai IoT-eszközön át az Align Technology pácienseknek szóló felületéig vezet.<br/><br/>Ebből két pozíció fejlesztésvezetői szerep volt, egy — a berlini Bertelsmann-nál töltött év — pedig egyáltalán nem fejlesztés. Mindkettő szerepel a listán, mert az önéletrajz pontosan akkor szűnik meg hasznos lenni, amikor kimarad belőle, ami nem illik a képbe."
  cta_primary: "Önéletrajz letöltése (PDF)"
  cta_primary_href: "/assets/zoltan-dagi-cv.pdf"
  cta_primary_download: true

