story:
  eyebrow: "A RÖVID VÁLTOZAT"
  title: "Hogyan futott az út."
  body: |
    2015-ben javításkövető és készletkezelő szoftverrel kezdtem egy szerviznél, amely Samsung és Vodafone készülékekkel dolgozott. Nem látványos, viszont kivételesen jó tanár: ha a nyilvántartás tévedett, egy valódi telefon tűnt el, és én támogattam azt a rendszert, amelyik ezt állította.

    Ezután két kockázati tőkéből épülő projekt következett, mindkettő fejlesztésvezetőként. Az első egy magyar cégeket összekötő B2B piactér volt, amely a közép-kelet-európai régióra bővült, üzleti logikája pedig később egy egészségturisztikai termékben hasznosult újra. A második a **RenaLevel** — érintésmentes folyadékszintmérő vizeletgyűjtő zsákhoz és sebészeti drénhez, a nyáktól felfelé építve, fölötte gépi tanulással támogatott monitorozással.

    Innen a munka nagyobb kódbázisok felé mozdult: incidenskezelő eszköz az **EPAM**-nél, majd az önéletrajz leghosszabb fejlesztői szakasza, az **Align Technology** pácienseknek szóló webes felületei az Ispyre Informaticson keresztül. Ide tartozott a MyInvisalign 3D kezeléstervező nézője, egy orvos-páciens chat könyvtár, több projektet érintő keretrendszer-frissítés, és annyi bizalom, hogy juniorokat mentoráljak és senior szintig interjúztassak.

    Van benne egy berlini év a **Bertelsmann**-nál is, ami egyáltalán nem szoftver. Azért szerepel az önéletrajzban, mert egy kiemelt nagyvállalati ügyfél EMEA-szintű kiszolgálása — globális szabályzatok lefordítása egy ország folyamataira, heti riportálás csapatok között — végül más néven ugyanaz volt: követelményelemzés.

working:
  eyebrow: "AHOGYAN DOLGOZOM"
  title: "Amit a csapat kap."
  description: "Az önéletrajz ezeket soft skillként sorolja fel. Viselkedésként megfogalmazva használhatóbbak — és őszintébbek."
  items:
    - title: "Agilis problémamegoldó"
      description: "Otthonosan mozgok Agile, Scrum és Kanban keretek között, de jobban érdekel a helyes dolog kiadása, mint a ceremónia szabályos levezetése."
    - title: "Jól alkalmazkodom"
      description: "Nyolc pozíció, hét cég, négy szakterület és három ország munkakörnyezete. A kódbázisok többsége már futott, mire megérkeztem."
    - title: "Önállóan is működöm"
      description: "Az elmúlt nyolc év nagyobb része távmunka volt, köztük két fejlesztésvezetői pozíció. Az önálló kibontakozás nem cél, hanem szokás."
    - title: "Együttműködő"
      description: "Junior fejlesztőket mentoráltam az Align Technology-nál és középiskolásokat az első pozíciómban, valamint juniortól senior szintig interjúztattam."
    - title: "Pontosság és kreativitás"
      description: "A mérnöki képzés abban látszik, hogy előbb megértem a rendszert, és csak utána nyúlok hozzá — a zenei képzés pedig abban, hogy elviselem ugyanannak a sokadik ismétlését, amíg jó nem lesz."
    - title: "Tisztában vagyok magammal"
      description: "Ezzel a listával is. Kérdezzen rá egy gyenge pontra, és a valódi választ kapja."

