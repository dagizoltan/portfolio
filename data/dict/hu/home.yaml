practice:
  eyebrow: "AMIVEL VALÓJÁBAN FOGLALKOZOM"
  title: "Három réteg, egy ember."
  description: "A legtöbb fejlesztőt e három közül egyre veszik fel. Az önéletrajzomban az a használható rész, hogy ugyanaz az ember lefedi mindhármat — így kevesebb az átadás, amikor kiderül, hogy a hiba kettő között van."
  items:
    - title: "Termék-frontend"
      description: "React és Next.js már futó termékeken: az Align Technology MyInvisalign 3D kezelésnézőjének újraépítése, orvos-páciens chat könyvtár fejlesztése, keretrendszer-frissítések egyszerre több projekten."
      tags: ["React", "Next.js", "TypeScript", "UX/UI"]
    - title: "Szolgáltatások és infrastruktúra"
      description: "Node.js és Deno a szerveren, AWS alatta. Incidenskezelő refaktorálása CloudFormationre, modulcsomagoló és kódolási szabványok bevezetése serverless függvényekre, majd az üzemeltetés költségének csökkentése."
      tags: ["Node.js", "Deno", "AWS", "Docker"]
    - title: "Beágyazott rendszerek"
      description: "Az a rész, ami ritkán szerepel frontendes önéletrajzban. Érintésmentes folyadékszintmérő vizeletgyűjtő zsákhoz és sebészeti drénhez — az érzékelő, a panel, a beágyazott kód és a fölötte futó, gépi tanulással támogatott monitorozás."
      tags: ["Embedded Rust", "Arduino", "Nyáktervezés", "IoT"]

