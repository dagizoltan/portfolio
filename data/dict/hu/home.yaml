head:
  title: "Dági Zoltán | Szoftverfejlesztő — Budapest"
  description: "Budapesti szoftverfejlesztő nyolc év tapasztalattal: frontend fejlesztés, Node.js és Deno szolgáltatások, beágyazott rendszerek. Az Align Technology páciensfelülete, EPAM incidenskezelő eszköz, orvostechnikai IoT-eszköz."
  keywords: "szoftverfejlesztő Budapest, frontend fejlesztő Magyarország, React fejlesztő, Next.js fejlesztő, Node.js fejlesztő, Deno fejlesztő, beágyazott rendszerek, távmunka fejlesztő"

hero:
  eyebrow: "BUDAPEST — JELENLEG ELÉRHETŐ"
  title: "Dági Zoltán"
  role: "Szoftverfejlesztő"
  short_description: "Nyolc év szoftveres munka a pácienseknek szóló felületektől az orvostechnikai eszköz nyákjáig."
  description: "Olyan termékekhez építek webes felületet, ahol a tévedésnek ára van — egy páciens a saját kezelési tervét nézi, egy operátor azonosítást hagy jóvá, egy szerviz valakinek a telefonját követi.<br/><br/>A munka nagyobb része a frontendre esik: React és Next.js, jellemzően olyan kódbázisokban, amelyek már futottak, mire megérkeztem. A ritkább fele az, ami alatta van — Node.js és Deno szolgáltatások, AWS infrastruktúra, és elég mélyen ahhoz, hogy megtervezzem a panelt, amin az érzékelő ül.<br/><br/><strong>Budapesten élek. Az elmúlt nyolc év nagyobb részét távmunkában dolgoztam.</strong>"
  cta_primary: "A munkáim"
  cta_primary_href: "/experience"
  cta_secondary: "Önéletrajz (PDF)"
  cta_secondary_href: "/assets/zoltan-dagi-cv.pdf"
  cta_secondary_download: true

