hero:
  eyebrow: "A TECHNOLÓGIÁK"
  title: "A teljes lista, csoportosítva."
  short_description: "Ugyanaz, ami az önéletrajzban szerepel, aszerint rendezve, hogy mi mire való."
  description: "Ez az önéletrajz technológiai listája, egyetlen tömb helyett aszerint csoportosítva, hogy mi mire való.<br/><br/>Azt mutatja, mivel dolgozom, nem azt, hogy mennyire jól — az önéletrajz sem állít szintet tételenként, és ez az oldal sem. Ha egy pozíciónál számít a konkrét mélység, kérdezzen rá, és egyenes választ kap."

labels:
