head:
  title: "Technológiák | Dági Zoltán — szoftverfejlesztő"
  description: "Dági Zoltán önéletrajzának teljes technológiai listája csoportosítva: JavaScript és TypeScript, React és Next.js, Node.js és Deno, AWS, Docker, beágyazott Rust és Arduino, Snyk és Checkmarx."
