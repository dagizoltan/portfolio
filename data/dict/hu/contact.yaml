faq:
  eyebrow: "MIELŐTT ÍRNA"
  title: "Elég gyakori kérdések."
  items:
    - question: "Elérhető most?"
      answer: "Igen — nyitott vagyok alkalmazotti és vállalkozói fejlesztői pozíciókra is. Az e-mail a leggyorsabb módja annak, hogy kiderüljön, az időzítés is stimmel-e."
    - question: "Távmunka, hibrid vagy irodai?"
      answer: "Elsősorban távmunka: az elmúlt nyolc év nagyobb része így telt, köztük két fejlesztésvezetői pozíció. A budapesti hibrid is működik. A teljes költözés inkább beszélgetés, mint igen."
    - question: "Frontend, backend vagy beágyazott?"
      answer: "A munka nagyobb része frontend volt, és a három közül ez a legerősebb. Ezt követik a Node.js és Deno szolgáltatások. A beágyazott valós, de szűkebb — egy komoly orvostechnikai IoT-projekt, nem egy évtizednyi firmware."
    - question: "Tud angolul dolgozni?"
      answer: "Igen. Folyékony angol, és az elmúlt nyolc év elosztott, angolul működő csapatokban telt. A magyar anyanyelv, a német középszint."
    - question: "Miért van az önéletrajzban egy nem fejlesztői év?"
      answer: "A berlini Bertelsmann-év egy kiemelt nagyvállalati ügyfél kiszolgálása volt EMEA-szerte. Azért szerepel, mert egy rést elrejteni rosszabb, mint megmagyarázni — és mert maga a munka, vagyis globális szabályzatok lefordítása egy ország folyamataira és a heti, csapatok közötti riportálás, többet hozott át, mint amennyinek látszik."
    - question: "Mivel készült ez az oldal?"
      answer: "Deno és Hono, szerveroldalon renderelt JSX-szel, build lépés és kliensoldali keretrendszer nélkül. Minden oldal YAML szótárakból áll elő, és minden szám rajta ezekből a fájlokból van megszámolva, nem beírva. A felsorolt technológiákból három szerepel a Technológiák oldalon is."

