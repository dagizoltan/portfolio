head:
  title: "Projektek | Dági Zoltán — szoftverfejlesztő"
  description: "Négy saját mérnöki projekt 2026-tól: UAV repülésvezérlő, valós idejű hangmotor, hosztbiztonsági orchestrátor és többügynökös orchestrációs motor. Rust, Deno, TypeScript és eBPF."
  keywords: "Rust fejlesztő portfólió, valós idejű rendszerek, beágyazott Rust, eBPF, Deno fejlesztő, többügynökös orchestráció, UAV repülésvezérlés, audio DSP, Budapest"

hero:
  eyebrow: "SAJÁT PROJEKTEK — 2026"
  title: "Négy rendszer, a határok kereséséhez."
  short_description: "Erre ment el az elmúlt két év: négy mérnöki projekt, egyik sem megrendelésre, egyik sem hétvégi munka."
  description: "2024 vége után nem vállaltam új pozíciót, hanem tanulásra fordítottam az időt — először az AI-ügynökökre és arra, hogyan lehet velük dolgozni, aztán az alábbi rendszerekre.<br/><br/>Ezek nem termékek, és egyik sem került ügyfélhez. Olyan területek, ahol azt kerestem, amit még nem tudtam: valós idejű garanciák, kernelszintű hálózatkezelés, biztonságkritikus szabályozási hurkok, és olyan folyamatok összehangolása, amelyek külön-külön is elromolhatnak.<br/><br/><strong>A forráskód privát. Bármelyiket szívesen végigveszem egy beszélgetésen, vagy kérésre hozzáférést adok egy adott repóhoz.</strong>"
