# ---------------------------------------------------------------------------
# Self-directed projects, 2026. Each entry's `figures` are measured from the
# repository itself: `commits` from the git history, `tests` from test
# attributes and registrations in the source, `lines` from tracked source
# files. They are counted, not estimated, and they describe volume — not
# quality, and not readiness.
