head:
  title: "Stack | Zoltán Dági — Software Developer"
  description: "The full technology list from Zoltán Dági's CV, grouped: JavaScript and TypeScript, React and Next.js, Node.js and Deno, AWS, Docker, embedded Rust and Arduino, Snyk and Checkmarx."
  keywords: "JavaScript developer, TypeScript, React, Next.js, Node.js, Deno, Rust, AWS, Docker, embedded Rust, Arduino, PlatformIO, Mbed OS, web security"

hero:
  eyebrow: "THE STACK"
  title: "Everything on the list, grouped."
  short_description: "The same technologies as the CV, sorted into the areas they belong to."
  description: "This is the CV's technology list, regrouped by what each thing is for rather than printed as one block.<br/><br/>It is a list of what I work with, not a ranking of how well — the CV makes no claim about depth per item, and neither does this page. If a specific level matters for a role, ask and I'll answer straight."

labels:
  total: "Technologies listed"

# ---------------------------------------------------------------------------
# Every item here appears on the CV. Groups are an editorial arrangement; the
# contents are not. Adding an item changes the counts on this page, the home
# page and the metrics strip automatically — nothing states a total in prose.
# ---------------------------------------------------------------------------
groups:
