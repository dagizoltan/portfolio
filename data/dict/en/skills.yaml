secondary:
  eyebrow: "SECONDARY SKILLS"
  title: "The things that are not a stack."
  description: "These are listed separately on the CV, and they stay separate here. They are disciplines rather than tools — the reason the embedded group above exists at all."
  items:
    - name: "UX and UI design"
      note: "Interface design alongside the implementation, not instead of it."
    - name: "SEO"
      note: "Applied on the Clinicabroad marketplace; the technical half rather than the content half."
    - name: "Embedded programming"
      note: "The discipline behind the Arduino, PlatformIO, Mbed OS and embedded Rust entries."
    - name: "Designing and repairing PCB"
      note: "Board design and rework — used on the RenaLevel fluid level meter."
    - name: "CAD modeling"
      note: "Mechanical design for the enclosure side of a hardware product."
    - name: "3D printing"
      note: "Prototyping the physical parts rather than waiting on a supplier."

