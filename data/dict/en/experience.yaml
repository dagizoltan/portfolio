head:
  title: "Experience | Zoltán Dági — Software Developer"
  description: "Eight years of software work: frontend engineering for Align Technology, incident tooling at EPAM, IoT and PCB development for medical devices, and B2B marketplace platforms."
  keywords: "software developer experience, frontend engineer Budapest, Next.js developer, Node.js developer, AWS CloudFormation, IoT developer, embedded developer Hungary"

hero:
  eyebrow: "WORK HISTORY — 2015 TO 2024"
  title: "Eight roles, one direction."
  short_description: "Every role below is taken from my CV, with the dates and durations computed from the dates themselves."
  description: "The path runs from repair-tracking software for Samsung and Vodafone service centres, through a venture-backed medical IoT device, to frontend engineering on Align Technology's patient-facing products.<br/><br/>Two of those roles were development lead positions, and one — a year at Bertelsmann in Berlin — was not engineering at all. Both are on the list, because leaving out the parts that do not fit the arc is how a CV stops being useful."
  cta_primary: "Download CV (PDF)"
  cta_primary_href: "/assets/zoltan-dagi-cv.pdf"
  cta_primary_download: true

