hero:
  eyebrow: "ABOUT"
  title: "Engineer first, developer second."
  short_description: "Automotive engineering, then software — which is why the hardware half of the CV is there."
  description: "I studied automotive engineering at Budapest University of Technology and Economics before writing software professionally, and that order explains most of what is unusual about my CV.<br/><br/>It is why a frontend developer has PCB design and CAD modelling on the list, why the medical IoT project went from sensor to board to interface rather than stopping at an API, and why I would rather understand the system underneath a problem than route around it.<br/><br/><strong>Hungarian native, fluent English, intermediate German.</strong>"
