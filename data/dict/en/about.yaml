story:
  eyebrow: "THE SHORT VERSION"
  title: "How the path actually ran."
  body: |
    I started in 2015 writing repair-tracking and stock management software for a service operation handling Samsung and Vodafone devices. Not glamorous, and an unusually good teacher: when the tracker was wrong, a real phone was unaccounted for, and I was the one supporting the system that said so.

    Two venture-backed projects followed, both as development lead. The first was a B2B marketplace for Hungarian companies that was extended across Central and Eastern Europe, then had its business logic reused for a second product in health tourism. The second was **RenaLevel** — a non-contact fluid level meter for urine bags and surgical drains, built from the PCB upwards with machine-learning-assisted monitoring on top.

    From there the work moved toward larger codebases: incident tooling at **EPAM**, then the longest engineering run on the CV, building patient-facing web interfaces for **Align Technology** through Ispyre Informatics. That role included the MyInvisalign 3D treatment viewer, a doctor–patient chat library, framework upgrades across multiple projects, and enough trust to mentor juniors and interview candidates up to senior level.

    There is also a year at **Bertelsmann** in Berlin that is not software at all. It is on the CV because client service for a blue-chip account across EMEA — translating global policy into one country's processes, reporting weekly across teams — turned out to be requirements work by another name.

working:
  eyebrow: "HOW I WORK"
  title: "What a team gets."
  description: "The CV lists these as soft skills. Stated as behaviour instead, they read more usefully — and more honestly."
  items:
    - title: "Agile problem-solver"
      description: "Comfortable in Agile, Scrum and Kanban, but more interested in shipping the right thing than in running the ceremony correctly."
    - title: "Highly adaptable"
      description: "Eight roles, seven companies, four domains and three countries' worth of working contexts. Most of the codebases were already running when I arrived."
    - title: "Works well alone"
      description: "Most of the last eight years were remote, including two development lead roles. Unblocking myself is a habit, not an aspiration."
    - title: "Collaborative"
      description: "Mentored junior engineers at Align Technology and high-school students in my first role, and interviewed candidates from junior through senior."
    - title: "Precision and creativity"
      description: "The engineering training shows up as a preference for understanding a system before changing it — and the music training as a tolerance for doing a thing repeatedly until it is right."
    - title: "Self-aware"
      description: "Including about this list. Ask about a weak spot and you'll get the actual answer."

