head:
  title: "Zoltán Dági | Software Developer — Budapest"
  description: "Software developer in Budapest with eight years across frontend engineering, Node.js and Deno services, and embedded systems. Worked on Align Technology's patient UI, EPAM incident tooling and a medical IoT device."
  keywords: "software developer Budapest, frontend developer Hungary, React developer, Next.js developer, Node.js developer, Deno developer, embedded developer, remote software developer"

hero:
  eyebrow: "BUDAPEST, HUNGARY — AVAILABLE FOR WORK"
  title: "Zoltán Dági"
  role: "Software Developer"
  short_description: "Eight years of software work, from patient-facing frontends to the PCB underneath a medical device."
  description: "I build web interfaces for products where being wrong has a cost — a patient reading their own treatment plan, an operator confirming an identity, a service centre tracking somebody's phone.<br/><br/>The frontend is where most of that work happens: React and Next.js, in codebases that were already running when I arrived. The less usual half is underneath it — Node.js and Deno services, AWS infrastructure, and far enough down to design the board a sensor sits on.<br/><br/><strong>Based in Budapest. Most of the last eight years worked remotely.</strong>"
  cta_primary: "See the work"
  cta_primary_href: "/experience"
  cta_secondary: "Download CV (PDF)"
  cta_secondary_href: "/assets/zoltan-dagi-cv.pdf"
  cta_secondary_download: true

