practice:
  eyebrow: "WHAT I ACTUALLY DO"
  title: "Three layers, one person."
  description: "Most developers are hired for one of these. The useful part of my CV is that the same person covers all three, which means fewer handovers when a problem turns out to live between them."
  items:
    - title: "Product frontend"
      description: "React and Next.js work on existing products: rebuilding Align Technology's MyInvisalign 3D treatment viewer, building a doctor–patient chat library, and carrying framework upgrades across several projects at once."
      tags: ["React", "Next.js", "TypeScript", "UX/UI"]
    - title: "Services & infrastructure"
      description: "Node.js and Deno on the server, AWS underneath. Refactoring an incident handler onto CloudFormation, imposing a bundler and coding standards on serverless functions, then cutting what it cost to run."
      tags: ["Node.js", "Deno", "AWS", "Docker"]
    - title: "Embedded & hardware"
      description: "The part that is rarely on a frontend CV. A non-contact fluid level meter for urine bags and surgical drains — the sensor, the board it sits on, the embedded code, and the ML-assisted monitoring above it."
      tags: ["Embedded Rust", "Arduino", "PCB design", "IoT"]

