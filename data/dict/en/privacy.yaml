head:
  title: "Privacy | Zoltán Dági"
  description: "What this site collects, which is almost nothing: no analytics, no cookies, no tracking. One external request, to Google Fonts."

hero:
  eyebrow: "PRIVACY"
  title: "Almost nothing happens here."
  short_description: "No analytics, no cookies, no tracking. One external font request, disclosed below."
  description: "This is a personal portfolio, not a service. It has no accounts, no forms and no database, so there is very little to say — but what there is, is said plainly."

updated: "Last updated: 15 October 2026"

sections:
  - title: "What this site collects"
    body: |
      Nothing. There is no analytics script, no tracking pixel, no advertising network and no cookie set by this site. Nothing is stored in your browser.

      There is no contact form, so there is no submitted data to process. The contact page links to a mailto: address, which opens your own mail client — nothing is transmitted by this page.

  - title: "Server logs"
    body: |
      The host serving this site keeps standard request logs — IP address, timestamp, requested path, user agent — as nearly every web server does. These are generated by the hosting platform, not by this site's code, and are used only to keep the site running.

  - title: "The one external request"
    body: |
      The stylesheet loads three typefaces from Google Fonts. Your browser requests those font files from `fonts.googleapis.com` and `fonts.gstatic.com`, which means Google receives your IP address and user agent as part of that request.

      This is the only third-party request the site makes. It is disclosed here rather than buried, and self-hosting the fonts to remove it is on the list.

  - title: "If you email me"
    body: |
      Mail sent to the address on this site sits in a Gmail mailbox, subject to Google's terms. I use it to reply to you and nothing else: no mailing list, no CRM, no sharing with third parties, no recruiter database.

      Ask me to delete a message and I will.

  - title: "Your rights"
    body: |
      Under the GDPR you may ask what personal data I hold about you, ask for it to be corrected or deleted, and object to its processing. In practice this means the contents of any email you have sent me.

      Write to **dagizoltan@gmail.com** and I'll handle it.

  - title: "Changes"
    body: |
      If this page changes, the date at the top changes with it. There is no notification mechanism, because there is no mailing list to notify.
